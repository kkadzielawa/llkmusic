{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="{% block meta_description %}{{ page_description|default:'LLKMusic by Konrad Kadzielawa shares blues and jazz guitar lessons, courses, blog posts, videos, and Chicago music services.' }}{% endblock %}">
  <meta name="keywords"
    content="{{ page_keywords|default:'LLKMusic, Konrad Kadzielawa, llkmusicvideos, blues & jazz Chicago, Chicago blues guitar, jazz guitar lessons, guitar courses, music blog' }}">
  <meta name="author" content="Konrad Kadzielawa">
  <meta name="application-name" content="LLKMusic">
  <meta name="robots" content="{{ robots_content|default:'index, follow' }}">
  <meta name="theme-color" content="#1f6f78">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="LLKMusic">
  <meta property="og:type" content="{{ og_type|default:'website' }}">
  <meta property="og:title" content="{{ page_title|default:'LLKMusic | Blues & Jazz | Blog & Courses' }}">
  <meta property="og:description"
    content="{{ page_description|default:'LLKMusic by Konrad Kadzielawa shares blues and jazz guitar lessons, courses, blog posts, videos, and Chicago music services.' }}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:image" content="{% if og_image %}{{ og_image }}{% else %}{{ default_og_image }}{% endif %}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title|default:'LLKMusic | Blues & Jazz | Blog & Courses' }}">
  <meta name="twitter:description"
    content="{{ page_description|default:'LLKMusic by Konrad Kadzielawa shares blues and jazz guitar lessons, courses, blog posts, videos, and Chicago music services.' }}">
  <meta name="twitter:image" content="{% if og_image %}{{ og_image }}{% else %}{{ default_og_image }}{% endif %}">
  <link rel="canonical" href="{{ canonical_url }}">
  <link rel="icon" href="{% static 'img/logo.jpg' %}" type="image/jpeg">
  <link rel="apple-touch-icon" href="{% static 'img/logo.jpg' %}">
  <link rel="me" href="https://www.youtube.com/@llkmusicvideos">
  <link rel="me" href="https://www.linkedin.com/in/konradkadzielawa/">
  <link rel="me" href="https://www.instagram.com/konradkadzielawa/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <script src="https://kit.fontawesome.com/6e526d197e.js" crossorigin="anonymous" defer></script>
  <title>{% block title %}{{ page_title|default:'LLKMusic | Blues & Jazz | Blog & Courses' }}{% endblock %}</title>
  {% if json_ld %}
  <script type="application/ld+json">{{ json_ld|safe }}</script>
  {% endif %}
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <div class="navbar">
    <div class="container flex">
      <span class="logo"><a href="{% url 'home' %}">LLKMusic</a></span>
      <nav class="nav-menu" id="nav-menu" aria-label="Main navigation">
        <ul>
          <li><a href="{% url 'home' %}"{% if request.resolver_match.url_name == 'home' %} aria-current="page"{% endif %}>Home</a></li>
          <li><a href="{% url 'blog:post_list' %}"{% if request.resolver_match.namespace == 'blog' %} aria-current="page"{% endif %}>Blog</a></li>
          <li><a href="{% url 'courses' %}"{% if request.resolver_match.url_name == 'courses' %} aria-current="page"{% endif %}>Courses</a></li>
          <li><a href="{% url 'services' %}"{% if request.resolver_match.url_name == 'services' %} aria-current="page"{% endif %}>Services</a></li>
          <li>
            <a href="{% url 'cart' %}" class="cart-nav-link" aria-label="View shopping cart status">
              <i class="fas fa-shopping-cart"></i>
              <span>Cart</span>
              <span class="cart-count" id="cart-count">0</span>
            </a>
          </li>
        </ul>
      </nav>
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav-menu">
        <span aria-hidden="true">&#9776;</span>
      </button>
    </div>
  </div>

  <main class="main-content" id="main-content" tabindex="-1">
    {% block content %}
    {% endblock content %}
  </main>

  <footer>
    <div class="container flex-between">
      <div>
        <span>&copy; {% now "Y" %} LLKMusic</span>
      </div>
      <div>
        <ul class="flex">
          <li><a href="https://www.linkedin.com/in/konradkadzielawa/" aria-label="LinkedIn"><i class="fab fa-linkedin-in fa-lg" aria-hidden="true"></i></a></li>
          <li><a href="https://www.youtube.com/@llkmusicvideos" aria-label="YouTube"><i class="fab fa-youtube fa-lg" aria-hidden="true"></i></a></li>
          <li><a href="https://twitter.com/kkadzielawa" aria-label="Twitter"><i class="fab fa-twitter fa-lg" aria-hidden="true"></i></a></li>
          <li><a href="https://www.instagram.com/konradkadzielawa/" aria-label="Instagram"><i class="fab fa-instagram fa-lg" aria-hidden="true"></i></a></li>
        </ul>
      </div>
    </div>
  </footer>
  <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
