{% extends 'base.html' %}

{% block title %}{{ page_title|default:post.title }}{% endblock %}

{% block content %}
<section class="blog-detail-section" style="padding: 50px 0;">
    <div class="container">
        <a href="{% url 'blog:post_list' %}" style="display: inline-block; margin-bottom: 20px; color: var(--primary-color); font-weight: bold; text-decoration: none; transition: color 0.2s;">&larr; Back to Blog</a>
        
        <article class="card" style="padding: 40px; overflow: hidden;">
            <h1 style="font-size: 2.8rem; line-height: 1.2; margin-bottom: 15px; color: #333;">{{ post.title }}</h1>
            
            <div style="font-size: 0.95rem; color: #777; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
                <span>Published on {{ post.created_at|date:"F d, Y" }}</span>
                <span style="margin: 0 10px;">|</span>
                <span>By {{ post.get_author_display_name }}</span>
            </div>
            
            <div class="blog-entry-content">
                {{ post.body|safe }}
            </div>
        </article>
    </div>
</section>
{% endblock content %}
